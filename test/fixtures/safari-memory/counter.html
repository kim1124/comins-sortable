<!doctype html><html lang="en"><meta charset="utf-8"><title>Safari memory counter control</title><body><h1>Safari memory counter control</h1><p>No product or framework imports.</p><button id="advance" type="button">Advance counter</button><output id="count">0</output><script>let count=0;document.getElementById('advance').addEventListener('click',()=>{count++;document.getElementById('count').textContent=String(count);});</script></body></html>
